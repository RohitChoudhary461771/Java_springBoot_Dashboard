<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Critical Events</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container-fluid mt-4">

    <!-- PAGE HEADER -->

    <div class="card shadow-sm mb-3">

        <div class="card-header bg-danger text-white d-flex justify-content-between align-items-center">

            <h4 class="mb-0">
                Critical Events (Last 24 Hours)
            </h4>

            <span class="badge bg-light text-danger"
                  th:text="${#lists.size(errorLogs)} + ' Events'">
            </span>

        </div>

    </div>

    <!-- ACTIONS 

    <div class="mb-3">

        <button class="btn btn-secondary"
                onclick="history.back()">

            ← Back to Dashboard

        </button>

    </div> -->



    <!-- ERROR LOG TABLE -->

    <div class="card shadow-sm">

        <div class="card-body p-0">

            <table class="table table-bordered table-striped table-hover mb-0">

                <thead class="table-dark">

                <tr>

                    <th style="width:170px;">
                        Date / Time
                    </th>

                    <th style="width:150px;">
                        Category
                    </th>

                    <th style="width:120px;">
                        Severity
                    </th>

                    <th>
                        Message
                    </th>

                </tr>

                </thead>

                <tbody>

                <tr th:if="${#lists.isEmpty(errorLogs)}">

                    <td colspan="4"
                        class="text-center text-success fw-bold">

                        ✅ No Critical Events Found

                    </td>

                </tr>

                <tr th:each="err : ${errorLogs}">

                    <td th:text="${err.logDate}">
                    </td>

                    <td>

                        <span class="badge bg-primary"
                              th:text="${err.category}">
                        </span>

                    </td>

                    <td>

                        <span th:if="${err.severity == 'Critical'}"
                              class="badge bg-danger">

                            Critical

                        </span>

                        <span th:if="${err.severity == 'High'}"
                              class="badge bg-warning text-dark">

                            High

                        </span>

                        <span th:if="${err.severity == 'Medium'}"
                              class="badge bg-info text-dark">

                            Medium

                        </span>

                    </td>

                    <td style="word-break: break-word;"
                        th:text="${err.message}">
                    </td>

                </tr>

                </tbody>

            </table>

        </div>

    </div>

    <!-- FOOTER -->

    <div class="text-center text-muted mt-3">

          SQL DBA Health Dashboard | Version 1.1.2

    </div>

</div>

</body>

</html>
