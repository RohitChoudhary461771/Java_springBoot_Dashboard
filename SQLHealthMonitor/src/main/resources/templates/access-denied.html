<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Access Denied</title>

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet">

<style>

body{
    margin:0;
    height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(135deg,#0f172a,#1e293b);
    font-family:Segoe UI,Tahoma,Geneva,Verdana,sans-serif;
}

.access-card{
    background:#ffffff;
    width:650px;
    padding:40px;
    border-radius:20px;
    text-align:center;
    box-shadow:0 15px 30px rgba(0,0,0,0.25);
}

.icon{
    font-size:70px;
    margin-bottom:15px;
}

.page-title{
    color:#dc3545;
    font-weight:700;
    margin-bottom:20px;
}

.user-box{
    background:#f8f9fa;
    border-radius:10px;
    padding:12px;
    margin-bottom:25px;
}

.message{
    font-size:16px;
    color:#495057;
    margin-bottom:20px;
}

.contact{
    background:#fff3cd;
    border-left:5px solid #ffc107;
    text-align:left;
    padding:15px;
    border-radius:8px;
}

.footer{
    margin-top:25px;
    color:#6c757d;
    font-size:13px;
}

</style>

</head>

<body>

<div class="access-card">

    <div class="icon">
        🚫
    </div>

    <h2 class="page-title">
        Access Denied
    </h2>

    <div class="user-box">
        <strong>Logged In User:</strong>
        <span th:text="${username}">DOMAIN\User</span>
    </div>

    <div class="message">
        Your account is not registered to access the
        <strong>SQL Health Monitoring Dashboard</strong>.
    </div>

    <div class="contact">
        <strong>Action Required:</strong><br>
        Please contact the DBA Team if you require access to this application.
    </div>

    <div class="footer">
        SQL Health Monitoring Dashboard
    </div>

</div>

</body>
</html>
